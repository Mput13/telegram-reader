name = "tg-cli-broker"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true
# The landing page and the signup page (/login) live on better-tg-cli.com; www redirects there. The CLI keeps using workers.dev.
routes = [
  { pattern = "better-tg-cli.com", custom_domain = true },
  { pattern = "www.better-tg-cli.com", custom_domain = true },
]
# No request/response logging: bodies carry invite tokens and the api_hash
observability = { enabled = false }

# kv_namespaces is filled in by `wrangler kv namespace create INVITES`
[[kv_namespaces]]
binding = "INVITES"
id = "4320febbafa14fa19579bcda05c8aebc"

# 5 credential requests per minute per IP (logins are rare; this only slows abuse)
[[ratelimits]]
name = "LIMITER"
namespace_id = "7001"
simple = { limit = 5, period = 60 }

# Self-serve signup page (src/signup.ts): 6 requests per minute per IP across both steps (code
# request and code check), separate from credentials
[[ratelimits]]
name = "SIGNUP_LIMITER"
namespace_id = "7002"
simple = { limit = 6, period = 60 }

# Signup codes go out through Cloudflare Email Sending from better-tg-cli.com (onboarded in Email
# Service). Without MAIL_FROM, signups stay closed (see src/signup.ts).
[[send_email]]
name = "EMAIL"

[vars]
MAIL_FROM = "invites@better-tg-cli.com"
# Signup limits (SIGNUP_DAILY_CAP, SIGNUP_CODES_PER_IP, SIGNUP_CODES_PER_EMAIL) are secrets, not vars,
# so the exact thresholds stay out of the repo; see src/signup.ts for the fallbacks
# Turnstile widget "better-tg-cli invites" (public); TURNSTILE_SECRET is a secret
TURNSTILE_SITE_KEY = "0x4AAAAAAFGjz6sghgDCcgsK"
