name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run build
      # Offline tests only: no Telegram session or network is ever used in CI
      - run: npm test
      - name: Versioned files match package.json
        # package.json is the only place the version is edited; gen-version copies it everywhere else
        run: |
          node scripts/gen-version.mjs
          git diff --exit-code || { echo '::error::Run "node scripts/gen-version.mjs" and commit the result'; exit 1; }

  windows:
    # Windows: DPAPI secret store, PowerShell dialogs, backslash paths, .cmd shims
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Smoke test the CLI
        shell: bash
        env:
          TG_NO_UPDATE_CHECK: '1'
        run: |
          node dist/telegram.mjs --version
          node dist/telegram.mjs help-all -g onboard | grep -q onboard
          node dist/telegram.mjs skill status | grep -q claude-code
      - name: Build and run the standalone telegram.exe
        shell: bash
        env:
          TG_NO_UPDATE_CHECK: '1'
        run: |
          scripts/build-binary.sh windows-x64 out
          mkdir smoke && pwsh -NoProfile -Command "Expand-Archive -Path (Get-ChildItem out/*.zip).FullName -DestinationPath smoke"
          ./smoke/telegram.exe --version
          ./smoke/telegram.exe help-all -g thread | grep -q 'read <chat>'
          ./smoke/telegram.exe skill status | grep -q claude-code
      - name: Check the exe version resource
        shell: pwsh
        run: |
          $info = (Get-Item smoke/telegram.exe).VersionInfo
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($info.ProductName -ne 'better-tg-cli' -or $info.ProductVersion -ne "$version.0") {
            throw "version resource: '$($info.ProductName)' '$($info.ProductVersion)'"
          }
