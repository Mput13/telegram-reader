version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: next
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /
    target-branch: next
    schedule: { interval: weekly }
    ignore:
      # `typescript` is deliberately TS 6 (editor API); TS 7 is @typescript/native
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      # teleproto tracks Telegram's TL layer; keep it in its own PR
      teleproto: { patterns: [teleproto] }
      dev-dependencies: { dependency-type: development, exclude-patterns: [teleproto] }
